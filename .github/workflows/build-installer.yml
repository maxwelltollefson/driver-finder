name: Build installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Revision bumped?
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: python tools/check_revision.py

      - name: Read version
        id: ver
        shell: bash
        run: python tools/print_version.py >> "$GITHUB_OUTPUT"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Setup.exe
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: DriverFinder-Setup-${{ steps.ver.outputs.tag }}
          path: dist/installer/DriverFinder-Setup.exe
          if-no-files-found: error

      - name: Release notes
        shell: bash
        run: python tools/release_notes.py > release_notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.label }}
          body_path: release_notes.md
          files: dist/installer/DriverFinder-Setup.exe
          make_latest: true
          overwrite_files: true
